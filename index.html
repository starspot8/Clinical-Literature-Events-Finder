<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pustaka Dokter</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--tx:#1b2733;--mut:#5f6f7e;--ac:#0b6e8a;--ac2:#e3f2f7;--bd:#dde4ea;--warn:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--tx:#e8eef3;--mut:#98a8b6;--ac:#5cc0dc;--ac2:#1d3440;--bd:#2a3844;--warn:#3a3317}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 2px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 14px}
form{display:flex;gap:8px;margin-bottom:8px}
input,select{padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:1rem;min-width:0}
#q{flex:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters label{font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.filters input{width:92px}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:.9rem;cursor:pointer;text-decoration:none;display:inline-block}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tab.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card b{display:block;margin-bottom:2px}
.m{color:var(--mut);font-size:.85rem}
.ab{font-size:.9rem;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.o{background:var(--ac2);color:var(--ac)}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--warn);margin-left:6px}
.msg{padding:12px;color:var(--mut)}
.foot{color:var(--mut);font-size:.8rem;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Pustaka Dokter</h1>
<p class="sub">Jurnal, riset, dan seminar kesehatan dalam satu tempat.</p>

<form id="f">
<input id="q" value="glaucoma" placeholder="Contoh: glaucoma, diabetic retinopathy" aria-label="Topik">
<button type="submit">Cari</button>
</form>

<div class="filters" id="flt">
<label>Dari tahun<input id="y1" inputmode="numeric" placeholder="mis. 1990"></label>
<label>Sampai<input id="y2" inputmode="numeric" placeholder="mis. 2005"></label>
<label>Urutan
<select id="so">
<option value="">Paling relevan</option>
<option value="P_PDATE_D desc">Terbaru</option>
<option value="P_PDATE_D asc">Terlama</option>
<option value="CITED desc">Paling banyak dikutip</option>
</select></label>
</div>

<div class="tabs">
<button class="tab on" data-t="j">Jurnal</button>
<button class="tab" data-t="r">Riset</button>
<button class="tab" data-t="s">Seminar</button>
</div>

<div id="out"></div>
<p class="foot">Sumber artikel: Europe PMC (mencakup PubMed/MEDLINE). PDF hanya untuk artikel open access dan diunduh langsung dari sumbernya; aplikasi ini tidak menyimpan file. Selalu rujuk artikel asli sebelum mengambil keputusan klinis.</p>
</main>
<script>
var API="https://www.ebi.ac.uk/europepmc/webservices/rest/search";
var tab="j";
var $=function(i){return document.getElementById(i)};
function enc(s){return encodeURIComponent(s)}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function txt(h){return new DOMParser().parseFromString(h||"","text/html").body.textContent||""}

function buildQuery(q,t,y1,y2){
  var type=t==="j"
    ?'(PUB_TYPE:"Review" OR PUB_TYPE:"Meta-Analysis" OR PUB_TYPE:"Systematic Review" OR PUB_TYPE:"Practice Guideline")'
    :'(PUB_TYPE:"Randomized Controlled Trial" OR PUB_TYPE:"Clinical Trial")';
  var s="("+q+") AND SRC:MED AND "+type+' NOT PUB_TYPE:"Retracted Publication"';
  if(y1||y2)s+=" AND PUB_YEAR:["+(y1||1900)+" TO "+(y2||2100)+"]";
  return s;
}
function pdfUrl(r){
  var l=(r.fullTextUrlList&&r.fullTextUrlList.fullTextUrl)||[],i;
  for(i=0;i<l.length;i++){if(l[i].documentStyle==="pdf"&&l[i].availabilityCode==="OA")return l[i].url}
  if(r.isOpenAccess==="Y"&&r.pmcid)return "https://europepmc.org/articles/"+r.pmcid+"?pdf=render";
  return "";
}
function srcUrl(r){
  if(r.pmid)return "https://pubmed.ncbi.nlm.nih.gov/"+r.pmid+"/";
  if(r.doi)return "https://doi.org/"+r.doi;
  return "";
}
function card(r){
  var y=parseInt(r.pubYear,10),old=y&&y<new Date().getFullYear()-10;
  var ab=txt(r.abstractText);if(ab.length>320)ab=ab.slice(0,320)+"...";
  var p=pdfUrl(r),s=srcUrl(r);
  var h='<div class="card"><b>'+esc(txt(r.title))+(old?'<span class="tag">artikel lama</span>':"")+'</b>';
  h+='<div class="m">'+esc(r.authorString||"")+'</div>';
  h+='<div class="m">'+esc(r.journalTitle||"")+" · "+esc(r.pubYear||"")+(r.citedByCount?" · dikutip "+esc(r.citedByCount)+"x":"")+'</div>';
  h+=ab?'<div class="ab">'+esc(ab)+'</div>':'<div class="ab m">Abstrak tidak tersedia.</div>';
  h+='<div class="row">';
  if(p)h+='<a class="btn" target="_blank" rel="noopener" href="'+esc(p)+'">Unduh PDF (gratis)</a>';
  if(s)h+='<a class="btn o" target="_blank" rel="noopener" href="'+esc(s)+'">Buka sumber</a>';
  if(!p&&r.doi)h+='<a class="btn o" target="_blank" rel="noopener" href="https://doi.org/'+esc(r.doi)+'">Penerbit</a>';
  return h+"</div></div>";
}
function search(){
  var q=$("q").value.trim();
  if(!q){$("out").innerHTML='<div class="msg">Ketik topik dulu.</div>';return}
  $("out").innerHTML='<div class="msg">Mencari...</div>';
  var url=API+"?query="+enc(buildQuery(q,tab,$("y1").value.trim(),$("y2").value.trim()))+"&format=json&resultType=core&pageSize=10";
  if($("so").value)url+="&sort="+enc($("so").value);
  fetch(url).then(function(x){if(!x.ok)throw new Error(x.status);return x.json()}).then(function(d){
    var l=(d.resultList&&d.resultList.result)||[];
    if(!l.length){$("out").innerHTML='<div class="msg">Tidak ada hasil. Coba kata kunci bahasa Inggris atau longgarkan filter tahun.</div>';return}
    $("out").innerHTML=l.map(card).join("");
  }).catch(function(){
    $("out").innerHTML='<div class="msg">Gagal menghubungi Europe PMC. Periksa koneksi internet lalu coba lagi.</div>';
  });
}
function gcal(t,s,e,loc){
  var f=function(x){return x.replace(/-/g,"")};
  var n=new Date(e+"T00:00:00Z");n.setUTCDate(n.getUTCDate()+1);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+enc(t)+"&dates="+f(s)+"/"+f(n.toISOString().slice(0,10))+"&location="+enc(loc);
}
function seminars(){
  $("out").innerHTML='<div class="msg">Memuat seminar...</div>';
  fetch("events.json").then(function(x){return x.json()}).then(function(l){
    var today=new Date().toISOString().slice(0,10);
    l=l.filter(function(v){return v.e>=today}).sort(function(a,b){return a.s<b.s?-1:1});
    if(!l.length){$("out").innerHTML='<div class="msg">Belum ada seminar mendatang.</div>';return}
    $("out").innerHTML=l.map(function(v){
      return '<div class="card"><b>'+esc(v.t)+'</b><div class="m">'+esc(v.s)+" s/d "+esc(v.e)+" · "+esc(v.l)+'</div><div class="m">Sumber: '+esc(v.src)+'</div><div class="row"><a class="btn" target="_blank" rel="noopener" href="'+esc(gcal(v.t,v.s,v.e,v.l))+'">+ Tambah ke kalender</a><a class="btn o" target="_blank" rel="noopener" href="'+esc(v.u)+'">Situs resmi</a></div></div>';
    }).join("");
  }).catch(function(){$("out").innerHTML='<div class="msg">Daftar seminar gagal dimuat.</div>'});
}
function go(){$("flt").style.display=tab==="s"?"none":"flex";if(tab==="s")seminars();else search()}
$("f").addEventListener("submit",function(e){e.preventDefault();if(tab==="s")tab="j",setTab("j");go()});
function setTab(t){document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-t")===t)})}
document.querySelectorAll(".tab").forEach(function(b){
  b.addEventListener("click",function(){tab=b.getAttribute("data-t");setTab(tab);go()});
});
$("so").addEventListener("change",function(){if(tab!=="s")search()});
go();
</script>
</body>
</html>
