name: Update seminar otomatis

on:
  schedule:
    - cron: "0 1 * * 1"   # tiap Senin, 08:00 WIB
  workflow_dispatch:       # tombol "Run workflow" untuk mencoba kapan saja

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Jalankan pembaruan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 script/update_events.py

      - name: Simpan perubahan dan terbitkan ulang situs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet events.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "Update seminar otomatis"
            git push
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
          fi

      - name: Buat Issue laporan
        if: hashFiles('laporan.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Update seminar $(date +%Y-%m-%d)" \
            --body-file laporan.md
